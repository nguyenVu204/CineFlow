services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set_SQL_SA_PASSWORD_in_.env}
    ports:
      - "${SQLSERVER_PORT:-15433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - cinema-network

  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cinema-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cinema_rabbitmq
    ports:
      - "${RABBITMQ_PORT:-15674}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cinema-network

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: identity_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set_SQL_SA_PASSWORD_in_.env};TrustServerCertificate=true;
      Jwt__SigningKey: ${JWT_SECRET:?Set_JWT_SECRET_in_.env}
      Jwt__Issuer: CineFlow.Identity
      Jwt__Audience: CineFlow.Api
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${IDENTITY_API_PORT:-5104}:8080"
    networks:
      - cinema-network

  movie-service:
    build:
      context: .
      dockerfile: src/Services/Movie/Movie.API/Dockerfile
    container_name: movie_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: ${JWT_SECRET:?Set_JWT_SECRET_in_.env}
      Jwt__Issuer: CineFlow.Identity
      Jwt__Audience: CineFlow.Api
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MovieDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set_SQL_SA_PASSWORD_in_.env};TrustServerCertificate=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${MOVIE_API_PORT:-5101}:8080"
    networks:
      - cinema-network

  cinema-service:
    build:
      context: .
      dockerfile: src/Services/Cinema/Cinema.API/Dockerfile
    container_name: cinema_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: ${JWT_SECRET:?Set_JWT_SECRET_in_.env}
      Jwt__Issuer: CineFlow.Identity
      Jwt__Audience: CineFlow.Api
      InternalService__ApiKey: ${INTERNAL_API_KEY:?Set_INTERNAL_API_KEY_in_.env}
      BookingService__BaseUrl: http://booking-service:8080/
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CinemaDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set_SQL_SA_PASSWORD_in_.env};TrustServerCertificate=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${CINEMA_API_PORT:-5102}:8080"
    networks:
      - cinema-network

  booking-service:
    build:
      context: .
      dockerfile: src/Services/Booking/Booking.API/Dockerfile
    container_name: booking_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: ${JWT_SECRET:?Set_JWT_SECRET_in_.env}
      Jwt__Issuer: CineFlow.Identity
      Jwt__Audience: CineFlow.Api
      InternalService__ApiKey: ${INTERNAL_API_KEY:?Set_INTERNAL_API_KEY_in_.env}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=BookingDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set_SQL_SA_PASSWORD_in_.env};TrustServerCertificate=true;
      Redis__Configuration: redis:6379
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BOOKING_API_PORT:-5103}:8080"
    networks:
      - cinema-network

  api-gateway:
    build:
      context: ./src/Gateway/ApiGateway
      dockerfile: Dockerfile
    container_name: api_gateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-service__Address: http://identity-service:8080/
      ReverseProxy__Clusters__movie-cluster__Destinations__movie-service__Address: http://movie-service:8080/
      ReverseProxy__Clusters__cinema-cluster__Destinations__cinema-service__Address: http://cinema-service:8080/
      ReverseProxy__Clusters__booking-cluster__Destinations__booking-service__Address: http://booking-service:8080/
    depends_on:
      identity-service:
        condition: service_started
      movie-service:
        condition: service_started
      cinema-service:
        condition: service_started
      booking-service:
        condition: service_started
    ports:
      - "${API_GATEWAY_PORT:-5100}:8080"
    networks:
      - cinema-network

  frontend:
    image: node:20-alpine
    container_name: cinema_frontend
    working_dir: /app
    volumes:
      - ./frontend/cinema-booking-client:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api-gateway:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    ports:
      - "${FRONTEND_PORT:-5174}:4173"
    depends_on:
      - api-gateway
    networks:
      - cinema-network

networks:
  cinema-network:
    driver: bridge
