version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-YourStrongPassword123!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1'" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - cinema-network

  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    ports:
      - "6379:6379"
    networks:
      - cinema-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cinema_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cinema-network

  movie-service:
    build:
      context: ./src/Services/Movie/Movie.API
      dockerfile: Dockerfile
    container_name: movie_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MovieDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5001:8080"
    networks:
      - cinema-network

  cinema-service:
    build:
      context: ./src/Services/Cinema/Cinema.API
      dockerfile: Dockerfile
    container_name: cinema_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CinemaDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5002:8080"
    networks:
      - cinema-network

  booking-service:
    build:
      context: ./src/Services/Booking/Booking.API
      dockerfile: Dockerfile
    container_name: booking_service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=BookingDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=true;
      Redis__Configuration: redis:6379
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "5003:8080"
    networks:
      - cinema-network

  api-gateway:
    build:
      context: ./src/Gateway/ApiGateway
      dockerfile: Dockerfile
    container_name: api_gateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__movie-cluster__Destinations__movie-service__Address: http://movie-service:8080/
      ReverseProxy__Clusters__cinema-cluster__Destinations__cinema-service__Address: http://cinema-service:8080/
      ReverseProxy__Clusters__booking-cluster__Destinations__booking-service__Address: http://booking-service:8080/
    depends_on:
      movie-service:
        condition: service_started
      cinema-service:
        condition: service_started
      booking-service:
        condition: service_started
    ports:
      - "5000:8080"
    networks:
      - cinema-network

  frontend:
    image: node:20-alpine
    container_name: cinema_frontend
    working_dir: /app
    volumes:
      - ./frontend/cinema-booking-client:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    ports:
      - "4173:4173"
    depends_on:
      - api-gateway
    networks:
      - cinema-network

networks:
  cinema-network:
    driver: bridge
